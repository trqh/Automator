[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
license = "MIT"
readme = "README.md"
name = "automator"
version = "0.1.1"
description = "Cross-platform GUI for managing and executing Python features"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "python-dateutil>=2.8.2",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "webdriver-manager>=4.0",
]

[project.scripts]
automator = "automator.ui.feature_manager_gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"automator.templates" = ["feature_main.py", "script.config"]
"automator.demo_scripts.feature_900003" = ["main.py", "script.config"]
